name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar e gerar o site
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Executar os testes
        run: npm test -- --watch=false

      - name: Gerar o site para o Pages
        run: npm run build:pages

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/indicemor-site/browser

  deploy:
    name: Publicar o site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
